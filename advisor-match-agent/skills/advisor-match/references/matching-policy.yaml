version: "4"
review_candidate_limit: 3
name_matching:
  exact_normalized_first_last: true
  ignore_middle_tokens: true
  fuzzy_names: false
  nickname_candidates_require_review: true
firm_wildcard:
  anchored: true
  minimum_length: 4
firm_similarity:
  minimum_similarity: 0.88
  conflict_similarity: 0.45
statuses: [Matched, Ambiguous Match, No Match]
confidence: [High, Uncertain, None, User Confirmed]
