[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
# Fidelity's production typefaces are proprietary. These open web fonts mirror
# the humanist sans + friendly slab pairing while retaining system fallbacks.
base = "light"
font = "'Source Sans 3':https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap, Arial, sans-serif"
headingFont = "'Roboto Slab':https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;600;700&display=swap, Rockwell, Georgia, serif"
codeFont = "'Source Code Pro':https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&display=swap, monospace"
baseFontSize = 16
codeFontSize = "0.875rem"
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
headingFontSizes = ["2.5rem", "2rem", "1.5rem", "1.25rem", "1rem", "0.875rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = true
chartCategoricalColors = ["#368727", "#3266E0", "#9747F6", "#C74B07", "#058070", "#997E05", "#047CB8", "#DC1616"]
chartSequentialColors = ["#EDFAEB", "#D4F3CF", "#BBEBB2", "#8AD97C", "#65C754", "#48AC36", "#368727", "#1E6F1D", "#0F5319", "#044014"]

[theme.light]
primaryColor = "#368727"
backgroundColor = "#F9F7F5"
secondaryBackgroundColor = "#F5F3F0"
textColor = "#141414"
linkColor = "#1D3986"
codeTextColor = "#292928"
codeBackgroundColor = "#F5F3F0"
borderColor = "#D9D8D5"
dataframeBorderColor = "#D9D8D5"
dataframeHeaderBackgroundColor = "#F5F3F0"
redColor = "#C31212"
orangeColor = "#C74B07"
yellowColor = "#877300"
greenColor = "#368727"
blueColor = "#3266E0"
violetColor = "#9747F6"
grayColor = "#525150"

[theme.light.sidebar]
backgroundColor = "#F5F3F0"
secondaryBackgroundColor = "#E6E4E1"
textColor = "#141414"
borderColor = "#D9D8D5"
primaryColor = "#368727"

[theme.dark]
primaryColor = "#368727"
backgroundColor = "#141414"
secondaryBackgroundColor = "#292928"
textColor = "#F9F7F5"
linkColor = "#8CC1FD"
codeTextColor = "#F5F3F0"
codeBackgroundColor = "#292928"
borderColor = "#525150"
dataframeBorderColor = "#525150"
dataframeHeaderBackgroundColor = "#403F3E"
redColor = "#FF6868"
orangeColor = "#FF9F37"
yellowColor = "#DBCA72"
greenColor = "#65C754"
blueColor = "#60A5FA"
violetColor = "#C293F9"
grayColor = "#D9D8D5"

[theme.dark.sidebar]
backgroundColor = "#292928"
secondaryBackgroundColor = "#403F3E"
textColor = "#F9F7F5"
borderColor = "#525150"
primaryColor = "#368727"
