[project]
name = "general-agent"
version = "0.1.0"
description = "Trusted-local general-purpose Deep Agent with a Streamlit chat UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.21.0",
    "charset-normalizer>=3.4.0",
    "deepagents>=0.7.0,<0.8.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14,<2.0.0",
    "langchain-openai>=1.1.11",
    "langgraph>=1.2.6",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "lxml>=5.3.0",
    "markitdown[docx,pptx,xlsx]>=0.1.3",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.0",
    "pillow>=11.0.0",
    "pip>=25.0",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.2",
    "reportlab>=4.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.0",
    "streamlit>=1.59.2,<1.60.0",
    "uvicorn[standard]>=0.35.0",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["general_agent*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires configured model credentials"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
